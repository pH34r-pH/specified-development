name: Foundation scaffold

on:
  pull_request:
    branches:
      - design/canonical-spec-directory

permissions:
  contents: read

jobs:
  scaffold:
    name: Validate scaffold and independent fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified official release commit
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, verified official release commit
        with:
          python-version: "3.12"
      - name: Validate published scaffold
        run: python tools/validate_foundation.py
      - name: Run independent malformed-input tests
        run: python -m unittest tests.test_foundation -v

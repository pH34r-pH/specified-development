name: Repository governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  # The shared validator only reads the checked-out profile.
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the shared governance profile
        uses: pH34r-pH/long-haul/.github/actions/repository-governance@28b9afbd17faa2baea9f2fb302abe7db71ee9882

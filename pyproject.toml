[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "specified-development-tools"
version = "0.1.0"
description = "Offline validation and review tools for Specified Development"
readme = {file = "docs/tooling.md", content-type = "text/markdown"}
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
authoring = ["PyYAML>=6.0.3,<7", "jsonschema>=4.26,<5", "markdown-it-py>=4.0,<5"]

[project.scripts]
specified-validate-foundation = "tools.validate_foundation:main"
specified-validate-bundle = "tools.bundle_validation:main"
specified-bundle-review = "tools.bundle_review:main"
specified-validate-spec = "tools.spec_validation:main"
specified-task-review = "tools.task_review:main"

[tool.setuptools]
packages = ["tools"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PIE", "EXE"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
